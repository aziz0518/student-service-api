services:
  db:
    image: postgres:15
    container_name: educenter_db
    environment:
      POSTGRES_DB: educenter_db
      POSTGRES_USER: educenter_user
      POSTGRES_PASSWORD: educenter_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: educenter_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: educenter_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"   # API Port (Django ulanishi uchun)
      - "9001:9001"   # Web Console Port (Brauzer interfeysi)
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data: